<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手绘埃菲尔铁塔</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fbfaf5;
    font-family: "Comic Sans MS", "Marker Felt", "Segoe Print", cursive;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    width: min(96vw, 900px);
    aspect-ratio: 3 / 4;
    background: #fffdf6;
    border: 1px solid #eee;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* 让笔触有一点手绘抖动感 */
  .ink {
    fill: none;
    stroke: #1c1c1c;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ink-thin {
    fill: none;
    stroke: #1c1c1c;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ink-thick {
    fill: none;
    stroke: #1c1c1c;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 让线条看起来有一点点颤抖 */
  path, polyline, line {
    filter: url(#roughen);
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 让笔触有轻微抖动 -->
      <filter id="roughen" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
        <feDisplacementMap in="SourceGraphic" scale="2.2"/>
      </filter>
    </defs>

    <!-- 云朵（左上） -->
    <g class="ink-thin">
      <path d="M 80 130
               C 70 110, 95 95, 115 105
               C 120 85, 160 80, 175 100
               C 195 90, 225 100, 220 125
               C 235 130, 235 155, 215 160
               C 210 175, 175 180, 160 165
               C 140 180, 105 175, 100 160
               C 80 160, 65 145, 80 130 Z"/>
      <!-- 云的内部一点小起伏 -->
      <path d="M 110 140 C 130 135, 160 140, 195 138"/>
    </g>

    <!-- 飞鸟（V 字剪影） -->
    <g class="ink">
      <path d="M 690 90  l 22 -16  l 22 16"/>
      <path d="M 770 80  l 18 -14  l 18 14"/>
      <path d="M 820 150 l 18 -12  l 18 12"/>
      <path d="M 140 470 l 22 -16  l 22 16"/>
      <path d="M 100 700 l 22 -16  l 22 16"/>
      <path d="M 740 540 l 22 -16  l 22 16"/>
      <path d="M 790 780 l 22 -14  l 22 14"/>
      <path d="M 740 870 l 20 -14  l 20 14"/>
    </g>

    <!-- ============ 埃菲尔铁塔 ============ -->
    <!-- 整个塔由几条“主轮廓线 + 平台 + 拱门 + 斜撑 + 网格”组成 -->

    <!-- 塔的左右两条主外轮廓（略带弧度） -->
    <g class="ink-thick">
      <!-- 左侧主轮廓 -->
      <path d="M 110 1100
               L 280 720
               L 360 470
               L 430 230
               L 450 130"/>
      <!-- 右侧主轮廓 -->
      <path d="M 790 1100
               L 620 720
               L 540 470
               L 470 230
               L 450 130"/>
      <!-- 顶上的尖塔与天线 -->
      <path d="M 450 130 L 442 100 L 458 100 Z"/>
      <line x1="450" y1="100" x2="450" y2="70"/>
      <circle cx="450" cy="68" r="2.5" fill="#1c1c1c"/>
    </g>

    <!-- 底部两个塔脚之间的拱门（半圆 + 内圈） -->
    <g class="ink-thick">
      <path d="M 350 1100
               C 360 1000, 540 1000, 550 1100"/>
      <!-- 拱门内侧轮廓 -->
      <path d="M 380 1100
               C 390 1030, 510 1030, 520 1100"/>
    </g>

    <!-- 底部第一层平台（最宽） -->
    <g class="ink-thick">
      <path d="M 110 1100 L 790 1100"/>
      <path d="M 150 1040 L 750 1040"/>
    </g>

    <!-- 底部第一层内的水平横梁（多条） -->
    <g class="ink-thin">
      <line x1="160" y1="1075" x2="745" y2="1075"/>
      <line x1="170" y1="1010" x2="735" y2="1010"/>
      <line x1="190" y1="985"  x2="715" y2="985"/>
    </g>

    <!-- 底部塔腿内的纵向斜撑（X 形交叉） -->
    <g class="ink-thin">
      <!-- 左腿 -->
      <line x1="160" y1="1100" x2="280" y2="720"/>
      <line x1="280" y1="1100" x2="160" y2="720"/>
      <!-- 右腿 -->
      <line x1="640" y1="1100" x2="620" y2="720"/>
      <line x1="620" y1="1100" x2="740" y2="720"/>
      <!-- 腿内横线 -->
      <line x1="190" y1="900" x2="270" y2="900"/>
      <line x1="220" y1="820" x2="295" y2="820"/>
      <line x1="610" y1="900" x2="700" y2="900"/>
      <line x1="620" y1="820" x2="690" y2="820"/>
    </g>

    <!-- 底部到中部的过渡（左内柱） -->
    <g class="ink-thick">
      <path d="M 280 720 L 430 230"/>
      <path d="M 620 720 L 470 230"/>
    </g>

    <!-- 中部第一层平台（较窄） -->
    <g class="ink-thick">
      <path d="M 280 720 L 620 720"/>
      <path d="M 305 690 L 595 690"/>
    </g>

    <!-- 中部第一层内的 X 形交叉与水平横梁 -->
    <g class="ink-thin">
      <line x1="295" y1="715" x2="350" y2="600"/>
      <line x1="345" y1="715" x2="305" y2="600"/>
      <line x1="555" y1="715" x2="600" y2="600"/>
      <line x1="610" y1="715" x2="565" y2="600"/>
      <line x1="320" y1="660" x2="580" y2="660"/>
      <line x1="335" y1="630" x2="565" y2="630"/>
    </g>

    <!-- 中部第一层到底部之间的小三角拱（塔腿内侧） -->
    <g class="ink-thin">
      <path d="M 350 720 L 410 640 L 470 720"/>
      <path d="M 430 720 L 450 660 L 470 720"/>
    </g>

    <!-- 中部第二层（中部拱门/楼层） -->
    <g class="ink-thick">
      <path d="M 360 470 L 540 470"/>
      <path d="M 378 445 L 522 445"/>
      <!-- 中部拱门 -->
      <path d="M 405 470 C 410 430, 490 430, 495 470"/>
      <path d="M 420 470 C 425 445, 475 445, 480 470"/>
    </g>

    <!-- 中部第二层内的 X 形 + 横线 -->
    <g class="ink-thin">
      <line x1="370" y1="465" x2="395" y2="380"/>
      <line x1="395" y1="465" x2="370" y2="380"/>
      <line x1="510" y1="465" x2="535" y2="380"/>
      <line x1="535" y1="465" x2="510" y2="380"/>
      <line x1="385" y1="420" x2="515" y2="420"/>
      <line x1="395" y1="395" x2="505" y2="395"/>
    </g>

    <!-- 中部第二层顶部小平台 -->
    <g class="ink-thick">
      <line x1="378" y1="445" x2="378" y2="425"/>
      <line x1="522" y1="445" x2="522" y2="425"/>
      <line x1="378" y1="425" x2="522" y2="425"/>
    </g>

    <!-- 上部收窄塔身 -->
    <g class="ink-thick">
      <path d="M 378 425 L 442 240"/>
      <path d="M 522 425 L 458 240"/>
    </g>

    <!-- 上部第一层平台（很窄） -->
    <g class="ink-thick">
      <line x1="430" y1="300" x2="470" y2="300"/>
    </g>

    <!-- 上部第一层内的 X 形与横线 -->
    <g class="ink-thin">
      <line x1="395" y1="425" x2="410" y2="320"/>
      <line x1="410" y1="425" x2="395" y2="320"/>
      <line x1="490" y1="425" x2="505" y2="320"/>
      <line x1="505" y1="425" x2="490" y2="320"/>
      <line x1="402" y1="370" x2="498" y2="370"/>
      <line x1="415" y1="335" x2="485" y2="335"/>
    </g>

    <!-- 顶部尖塔的网格（细斜线 / 网格感） -->
    <g class="ink-thin">
      <line x1="442" y1="240" x2="430" y2="180"/>
      <line x1="458" y1="240" x2="470" y2="180"/>
      <line x1="438" y1="220" x2="462" y2="220"/>
      <line x1="436" y1="200" x2="464" y2="200"/>
      <line x1="434" y1="180" x2="466" y2="180"/>
      <!-- 顶上的小尖 -->
      <line x1="445" y1="180" x2="450" y2="130"/>
      <line x1="455" y1="180" x2="450" y2="130"/>
    </g>

    <!-- 一些零散的“点 / 小圆” 模拟手绘偶有的小墨点 -->
    <g fill="#1c1c1c">
      <circle cx="300" cy="850" r="1.2"/>
      <circle cx="640" cy="780" r="1.2"/>
      <circle cx="450" cy="350" r="1.2"/>
      <circle cx="220" cy="980" r="1.2"/>
      <circle cx="700" cy="1010" r="1.2"/>
    </g>
  </svg>
</div>
</body>
</html>
